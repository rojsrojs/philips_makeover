<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hem · bakgrundsbilder</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b0b0d; color: #eee;
         margin: 0 auto; padding: 28px 16px; max-width: 460px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #aaa; margin: 0 0 24px; line-height: 1.4; }
  label { display: block; font-size: 14px; color: #aaa; margin: 18px 0 6px; }
  input, button { font: inherit; font-size: 18px; width: 100%; box-sizing: border-box;
                  padding: 14px; border-radius: 14px; border: 0; }
  #pin { background: #1c1c20; color: #fff; text-align: center; letter-spacing: 10px; font-size: 26px; }
  #files { background: #1c1c20; color: #ccc; }
  button { margin-top: 24px; background: #fff; color: #000; font-weight: 600; }
  button:disabled { opacity: .4; }
  #bar { height: 6px; background: #1c1c20; border-radius: 3px; margin-top: 20px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; transition: width .2s; }
  #status { margin-top: 14px; white-space: pre-line; line-height: 1.4; }
</style>
</head>
<body>
<h1>Bilder till TV:ns slideshow</h1>
<p>Välj bilder från mobilen. De anpassas till TV:n och dyker upp under Slideshow → Välj bilder.</p>

<label for="pin">Kod från TV:n</label>
<input id="pin" type="text" inputmode="numeric" maxlength="4" autocomplete="off">

<label for="files">Bilder</label>
<input id="files" type="file" accept="image/*" multiple>

<button id="send">Ladda upp</button>
<div id="bar"><div id="fill"></div></div>
<div id="status"></div>

<script>
const $ = id => document.getElementById(id);
const status = text => { $('status').textContent = text; };
const progress = part => { $('fill').style.width = Math.round(part * 100) + '%'; };

// The QR code on the TV links here with ?pin=1234, so the code is filled in already.
const pinFromLink = new URLSearchParams(location.search).get('pin');
if (pinFromLink) $('pin').value = pinFromLink;

$('send').onclick = async () => {
  const pin = $('pin').value.trim();
  const files = [...$('files').files];
  if (pin.length !== 4) return status('Skriv in den fyrsiffriga koden som visas på TV:n.');
  if (!files.length) return status('Välj minst en bild.');

  $('send').disabled = true;
  try {
    const check = await fetch('/check?pin=' + encodeURIComponent(pin));
    if (!check.ok) return status('Fel kod. Kontrollera koden på TV:n.');

    let done = 0;
    const failed = [];
    progress(0);
    for (const [i, file] of files.entries()) {
      status(`Laddar upp ${i + 1} av ${files.length} …`);
      try {
        const url = `/upload?pin=${encodeURIComponent(pin)}&name=${encodeURIComponent(file.name)}`;
        const response = await fetch(url, { method: 'POST', body: file });
        if (response.ok) done++; else failed.push(file.name);
      } catch (e) {
        failed.push(file.name);
      }
      progress((i + 1) / files.length);
    }
    status(`Klart! ${done} av ${files.length} bilder finns nu på TV:n.` +
           (failed.length ? `\nKunde inte laddas upp: ${failed.join(', ')}` : ''));
    $('files').value = '';
  } catch (e) {
    status('Kunde inte nå TV:n. Är uppladdningsfönstret fortfarande öppet på TV:n?');
  } finally {
    $('send').disabled = false;
  }
};
</script>
</body>
</html>
